# trade_master（模拟交易 + AI 托管）nginx 反向代理配置
# 放到服务器 /etc/nginx/conf.d/trade-master.conf（或 sites-available 后 ln -s）
#
# HTTPS：装好证书后，用 certbot --nginx 会自动补 443 server block 并加证书；
# 也可手动按注释补 443。以下先给 80（HTTP），certbot 接管后自动跳转 HTTPS。

server {
    listen 80;
    server_name trade.videotonote.cn;   # ← 改成你要用的子域名

    # ⚠️ **必须放宽**：nginx 默认只收 1MB 的请求体，而持仓/自选股截图走的是 base64 JSON，
    # 手机截图原图 3-5MB、base64 后还要再涨 1/3。超限时 nginx 在读完请求体之前就回 413，
    # **这一步发生在应用之前**——后端日志里一条都不会有，排查时会误以为是 OCR 挂了。
    # 前端已做缩放（长边 1600px + JPEG，通常两三百 KB），这里是兜底，不是主防线。
    # 改完记得 `nginx -t && nginx -s reload`。
    client_max_body_size 24m;

    # ⚠️ 必须排在 `location /` **之前**，且用 `^~`（前缀匹配胜出后不再试正则）。
    # `/api/internal/*` 是运维端点：手动跑执行层（会真实下单）、读调度器状态。
    # 它们只该从服务器本机访问（curl 127.0.0.1:8010），公网一律 404——**回 404 而不是
    # 403**，403 等于告诉外面"这里有个端点，只是你没权限"。应用层还有一道 token
    # （未配置即拒绝，见 app.config.INTERNAL_TOKEN），这里是外面那道。
    location ^~ /api/internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 账户问答/意图解析等同步 LLM 调用可能较慢，放宽超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

